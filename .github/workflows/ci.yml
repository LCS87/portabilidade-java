name: CI

# Fase 0 do PLANO_MELHORIAS.md — build + testes + cobertura (gate jacoco ≥70% no core)
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test e verify (jacoco check + checkstyle)
        run: mvn -B -ntp clean verify

      - name: Publicar relatório de cobertura (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          retention-days: 14

      - name: Publicar fat jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: portabilidade-java-batch
          path: portability-batch/target/portabilidade-java.jar
          retention-days: 14
