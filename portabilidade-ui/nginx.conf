server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy same-origin para o BFF: evita CORS e URL fixa de host no bundle.
    location /bff/ {
        proxy_pass http://portability-bff:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/progresso) precisa de streaming sem buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Angular SPA: rotas profundas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
