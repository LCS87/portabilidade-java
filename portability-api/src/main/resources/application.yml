# Fase 2 (PLANO_MELHORIAS): configuração da API REST hexagonal.
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/csv
  error:
    include-message: always

spring:
  application:
    name: portability-api
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  threads:
    virtual:
      # Java 21 + Spring Boot 3.3: Tomcat atende requisições em virtual threads
      enabled: true
  rabbitmq:
    # Fase 4: fila duravel de jobs batch (usada apenas com FEATURE_BATCH_QUEUE=true)
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: ${BATCH_WORKER_CONCURRENCY:2-8}   # workers por instância
        prefetch: 1                                    # 1 job por worker em execução
        acknowledge-mode: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  data:
    # base-dir: pasta onde ficam Operadoras*.csv, prefixos_operadora.json e portabilidade.duckdb
    base-dir: ${user.dir}
    # duckdb-path / operadores-csv / prefixos-json: override explícito (opcional)
  cache:
    enabled: true
    ttl-minutes: 360
    max-size: 500000
  batch:
    upload-dir: target/api-upload
    output-dir: target/api-output
    chunk-size: 50000
    max-rows: 1000000
    queue:
      # Feature flag da Fase 4: true -> jobs vao para a fila RabbitMQ
      # (QueuedBatchExecutor + BatchJobListener); false -> executor local
      # em memoria com virtual threads (comportamento padrao da Fase 2).
      enabled: ${FEATURE_BATCH_QUEUE:false}
  features:
    cache-enabled: ${FEATURE_CACHE:true}

logging:
  level:
    root: INFO
    com.portabilidade: INFO

# ── Fase 4: escalabilidade & observabilidade ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness (K8s)
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1         # amostragem OTLP; subir via env em incidentes
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

