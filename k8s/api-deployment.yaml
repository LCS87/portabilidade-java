# Fase 4: API REST — HPA por CPU + probes liveness/readiness (actuator)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portability-api
  namespace: portabilidade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portability-api
  template:
    metadata:
      labels:
        app: portability-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api
          image: portability-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: FEATURE_BATCH_QUEUE
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits:   { memory: "1536Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portability-api
  namespace: portabilidade
spec:
  selector: { app: portability-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portability-api
  namespace: portabilidade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portability-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
