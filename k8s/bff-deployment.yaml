apiVersion: apps/v1
kind: Deployment
metadata:
  name: portability-bff
  namespace: portabilidade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portability-bff
  template:
    metadata:
      labels:
        app: portability-bff
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: bff
          image: portability-bff:latest
          ports:
            - containerPort: 8081
          env:
            - name: BFF_API_BASE_URL
              value: "http://portability-api:8080"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
---
apiVersion: v1
kind: Service
metadata:
  name: portability-bff
  namespace: portabilidade
spec:
  selector: { app: portability-bff }
  ports: [{ port: 8081, targetPort: 8081 }]
