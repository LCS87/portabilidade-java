server:
  port: 8081
  compression:
    enabled: true

spring:
  codec:
    max-in-memory-size: 64MB
  threads:
    virtual:
      enabled: true   # Netty + handlers bloqueantes em virtual threads (Java 21)

bff:
  cors:
    allowed-origins: ${BFF_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  api:
    base-url: ${BFF_API_BASE_URL:http://localhost:8080}
    timeout-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ── Fase 4: observabilidade ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # liveness/readiness para Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
